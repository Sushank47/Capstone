version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mediexplain-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mediexplain_db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediexplain-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=mediexplain_db
      - SECRET_KEY=mediexplain-super-secret-key-production-32bytes
      - ENVIRONMENT=production
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediexplain-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
